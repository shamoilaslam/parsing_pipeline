name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nightly: the slow gates run even when nothing was pushed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[ocr,dev]"
      - run: python -m ruff check eval docintel
      - run: python -m mypy
      - run: python -m pytest tests -q

  # Byte-level snapshot of everything the parser writes for data/pdfs.  The
  # baseline was recorded on Windows; it runs there until Linux output is shown
  # to be byte-identical, because a gate that differs by OS is not a gate.
  snapshot:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[ocr]"
      - run: python -m eval.snapshot check data/pdfs --workers 4
