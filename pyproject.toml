[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-caselaw-parser"
version = "0.1.0"
description = "Deterministic, layout-aware parser for Pakistani case-law PDFs"
requires-python = ">=3.11"
# Parsing only.  Everything the digital and OCR routes touch, and nothing
# else: `specter.urdu_ocr` is the sole module that imports the ML stack, and
# no parse path imports it.  Keeping torch out of the base install is what
# makes this deployable on another machine in seconds rather than 2 GB.
#
# PyMuPDF is pinned exactly: a minor release has changed the whitespace it
# extracts, which moves the gold numbers.  Upgrading it is a deliberate
# re-baseline, not a routine bump.
dependencies = [
  "PyMuPDF==1.28.0",
  "Pillow>=10",
  "numpy>=1.26",
  "opencv-python>=4.8",
  "psutil>=5.9",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Required for scanned documents -- 29% of IHC, 28% of SC, 3.5% of LHC.
# Pinned to the version every scanned-slice number was measured with.  (The
# old ">=1.3" named releases that do not exist for Python 3.13.)
ocr = ["rapidocr-onnxruntime==1.2.3"]
# The local Urdu recogniser experiments only (`specter/urdu_ocr.py`).
urdu = [
  "accelerate==1.12.0",
  "albumentations==2.0.8",
  "transformers==5.6.1",
  "timm==1.0.22",
  "open-clip-torch>=3.3.0",
  "huggingface-hub>=1.26.0",
  "sentencepiece>=0.2.2",
]
# `specter benchmark` scores text with jiwer; parsing does not.
bench = ["jiwer>=3.0"]
dev = ["pytest>=8", "jiwer>=3.0", "fonttools>=4.50", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7"]

[project.scripts]
docintel = "docintel.__main__:main"
specter = "specter.__main__:main"

[tool.setuptools.packages.find]
include = ["specter*", "docintel*", "intel*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Moved-not-rewritten code is outside the lint/type gates until it is touched on purpose.
extend-exclude = ["_quarantine", "docintel/engines/native.py", "docintel/engines/scanned.py", "docintel/engines/urdu_ocr.py", "docintel/engines/urdu_vision.py", "docintel/legal", "docintel/pipeline.py", "docintel/benchmark.py", "docintel/report.py", "docintel/inspect_html.py", "docintel/validate.py"]

[tool.ruff.lint]
# Lint for defects only.  The existing modules are not reformatted: that would
# rewrite most lines of the repository, and every one of them would lose its blame.
select = ["F", "E9", "B"]
ignore = [
  "B008",   # argparse / dataclass defaults are intentional
  "B905",   # zip() without strict=: the codebase relies on truncation deliberately
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Gradual: modules opt in to strict checking as they are written or touched.
check_untyped_defs = false
# Widened module by module as each is moved into docintel/ or touched.
files = ["eval", "docintel"]
exclude = ['docintel/engines/(native|scanned|urdu_ocr|urdu_vision)\.py', 'docintel/legal/', 'docintel/(pipeline|benchmark|report|inspect_html|validate)\.py']

# Errors inside the moved modules are not this gate's business (see `exclude`).
[[tool.mypy.overrides]]
module = ["docintel.engines.native", "docintel.engines.scanned", "docintel.engines.urdu_ocr", "docintel.engines.urdu_vision", "docintel.legal.*", "docintel.pipeline", "docintel.benchmark", "docintel.report", "docintel.inspect_html", "docintel.validate"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

