[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-caselaw-parser"
version = "0.1.0"
description = "Deterministic, layout-aware parser for Pakistani case-law PDFs"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24",
  "Pillow>=10",
  "numpy>=1.26",
  "opencv-python>=4.8",
  "jiwer>=3.0",
  "python-bidi>=0.4",
  "psutil>=5.9",
  "accelerate==1.12.0",
  "albumentations==2.0.8",
  "transformers==5.6.1",
  "timm==1.0.22",
  "open-clip-torch>=3.3.0",
  "huggingface-hub>=1.26.0",
  "sentencepiece>=0.2.2",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
specter = "specter.__main__:main"

[tool.setuptools.packages.find]
include = ["specter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

