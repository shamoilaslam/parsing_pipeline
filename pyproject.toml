[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-caselaw-parser"
version = "0.1.0"
description = "Deterministic, layout-aware parser for Pakistani case-law PDFs"
requires-python = ">=3.11"
# Parsing only.  Everything the digital and OCR routes touch, and nothing
# else: `specter.urdu_ocr` is the sole module that imports the ML stack, and
# no parse path imports it.  Keeping torch out of the base install is what
# makes this deployable on another machine in seconds rather than 2 GB.
dependencies = [
  "PyMuPDF>=1.24",
  "Pillow>=10",
  "numpy>=1.26",
  "opencv-python>=4.8",
  "python-bidi>=0.4",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Required for scanned documents -- 29% of IHC, 28% of SC, 3.5% of LHC.
ocr = ["rapidocr-onnxruntime>=1.3"]
# The local Urdu recogniser experiments only (`specter/urdu_ocr.py`).
urdu = [
  "accelerate==1.12.0",
  "albumentations==2.0.8",
  "transformers==5.6.1",
  "timm==1.0.22",
  "open-clip-torch>=3.3.0",
  "huggingface-hub>=1.26.0",
  "sentencepiece>=0.2.2",
]
# `specter benchmark` scores text with jiwer; parsing does not.
bench = ["jiwer>=3.0"]
dev = ["pytest>=8", "jiwer>=3.0"]

[project.scripts]
specter = "specter.__main__:main"

[tool.setuptools.packages.find]
include = ["specter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

